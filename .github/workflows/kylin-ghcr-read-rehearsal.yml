name: Verify private Kylin ARM64 image access

on:
  push:
    branches: [ci/kylin-ghcr-read-rehearsal]
    paths: [.github/workflows/kylin-ghcr-read-rehearsal.yml]

permissions:
  contents: read

jobs:
  read-image:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 10
    env:
      IMAGE: ghcr.io/shinny-chenyi/kylin-dev-arm@sha256:533c89f3d14eb54f4ba5cd6a2a08b792df8a8a2e6a9910990f169bf074e89764
    steps:
      - name: Authenticate to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: shinny-chenyi
          password: ${{ secrets.KYLIN_GHCR_TOKEN }}
      - name: Verify pinned image can be pulled
        run: |
          set -euo pipefail
          docker pull --platform linux/arm64 "${IMAGE}"
          test "$(docker image inspect --format '{{.Architecture}}' "${IMAGE}")" = arm64
