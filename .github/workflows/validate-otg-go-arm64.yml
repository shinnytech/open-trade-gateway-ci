name: Validate OTG Go ARM64 implementation
on:
  push:
    branches: [feat/otg-go-kylin-arm64]
permissions:
  contents: read
  packages: read
jobs:
  validate:
    runs-on: ubuntu-22.04-arm
    timeout-minutes: 115
    env:
      SOFTWARE_PAYLOAD_ARCH: arm64
      SOFTWARE_PAYLOAD_VARIANT: kylin-xc
      DIST_SOFTWARE: dist/xc/software
      OTG_VERSION: 2.3.14+arm64.validation.075bb2d129b9
      COMMIT_SHA: 075bb2d129b9be42018aa36f7f2ab4c9c89e913a
    steps:
      - name: Checkout implementation for one-time validation
        uses: actions/checkout@v4
        with:
          repository: shinnytech/otg-go
          ref: 075bb2d129b9be42018aa36f7f2ab4c9c89e913a
          token: ${{ secrets.KYLIN_CI }}
          persist-credentials: false
          fetch-depth: 1
          lfs: true
      - name: Set source epoch
        run: echo "SOURCE_DATE_EPOCH=$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version: '1.25.0'
          cache: false

      - name: Login to Kylin build registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.KYLIN_CI }}

      - name: Install Gitleaks
        env:
          GITLEAKS_VERSION: 8.30.1
        run: |
          set -euo pipefail
          case "$(uname -m)" in
            x86_64) gitleaks_arch="x64" ;;
            aarch64|arm64) gitleaks_arch="arm64" ;;
            *) echo "Unsupported architecture: $(uname -m)" >&2; exit 2 ;;
          esac
          asset="gitleaks_${GITLEAKS_VERSION}_linux_${gitleaks_arch}.tar.gz"
          checksums="gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          base_url="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          download_dir="$(mktemp -d)"
          install_dir="${RUNNER_TEMP}/gitleaks-bin"
          mkdir -p "${install_dir}"
          curl -fsSL -o "${download_dir}/${asset}" "${base_url}/${asset}"
          curl -fsSL -o "${download_dir}/${checksums}" "${base_url}/${checksums}"
          grep "  ${asset}$" "${download_dir}/${checksums}" |
            (cd "${download_dir}" && sha256sum -c -)
          tar -xzf "${download_dir}/${asset}" -C "${download_dir}" gitleaks
          install -m 0755 "${download_dir}/gitleaks" "${install_dir}/gitleaks"
          echo "${install_dir}" >> "${GITHUB_PATH}"

      - name: Build and audit release payload
        run: |
          set -euo pipefail
          audit_dir="${RUNNER_TEMP}/release-payload-audit"
          mkdir -p "${audit_dir}" coverage
          build_log="${audit_dir}/build.log"
          audit_report="${audit_dir}/report.json"
          (
            cd otg-go/cmd/instance-deploy
            CGO_ENABLED=0 go build -trimpath -buildvcs=false \
              -o "${RUNNER_TEMP}/instance-deploy" .
          )
          set +e
          scripts/build_release_payload.sh >"${build_log}" 2>&1
          build_status=$?
          set -e
          "${RUNNER_TEMP}/instance-deploy" audit-secrets \
            --repo-root "${GITHUB_WORKSPACE}" \
            --path "${GITHUB_WORKSPACE}/dist" \
            --path "${build_log}" \
            --report "${audit_report}"
          cat "${build_log}"
          if [ "${build_status}" -ne 0 ]; then
            exit "${build_status}"
          fi
          cp "${audit_report}" coverage/release-payload-secret-audit.json

      - name: Verify release artifacts
        run: |
          set -euo pipefail
          shopt -s nullglob
          payloads=("${DIST_SOFTWARE}"/otg-go_"${OTG_VERSION}"_*.tar.gz)
          if [ "${#payloads[@]}" -ne 1 ]; then
            echo "Expected exactly one payload for ${OTG_VERSION}, got ${#payloads[@]}" >&2
            exit 1
          fi
          payload="${payloads[0]}"
          digest="${payload}.sha256"
          test -f "${digest}"
          (
            cd "$(dirname "${payload}")"
            sha256sum -c "$(basename "${digest}")"
          )
          python3 scripts/software_payload.py verify --archive "${payload}"

      - name: Smoke ARM64 programs and XC mode contracts
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json, pathlib, subprocess
          root = pathlib.Path('dist/xc/software/stage').resolve()
          # 打包器已独立核验所有 ELF 架构和依赖；这里在原生 ARM runner 实际执行入口。
          for command in (
              ['bin/otg', '-v'], ['bin/otgctl', 'version'], ['bin/api-gateway', '--help'],
              ['tools/instance-deploy', 'help'], ['tools/instance-deploy', 'upload-receipt', '--help'],
              ['tools/jq', '--version'],
          ):
              subprocess.run([str(root / command[0]), *command[1:]], check=True, timeout=30)
          PY
          go -C otg-go test -tags ctp_xc ./internal/backend/ctp/betterctp ./internal/backend/enginefactory

